<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="320" fill="#ffffff"/>

  <rect x="30" y="115" width="215" height="90" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="137" y="152" text-anchor="middle" font-size="20" fill="#1a1a1a">One fair day</text>
  <text x="137" y="176" text-anchor="middle" font-size="14" fill="#777777">≈ 40 conversations</text>

  <path d="M245 148 C300 148 310 100 366 90" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#m1)"/>
  <path d="M245 172 C300 172 310 220 366 230" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="375" y="35" width="455" height="105" rx="10" fill="#fdf2ee" stroke="#e4572e" stroke-width="1.5"/>
  <text x="400" y="72" font-size="20" fill="#1a1a1a">Private coaching — to the rep</text>
  <text x="400" y="99" font-size="14" fill="#777777">what worked, what to change, phase by phase</text>
  <text x="400" y="121" font-size="14" fill="#777777">sent to them, and to no one else</text>

  <line x1="300" y1="180" x2="830" y2="180" stroke="#d5d5d5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="830" y="172" text-anchor="end" font-size="13" fill="#9a9a9a" letter-spacing="0.4">nothing individual crosses this line</text>

  <rect x="375" y="200" width="455" height="105" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="237" font-size="20" fill="#1a1a1a">Day summary — to the employer</text>
  <text x="400" y="264" font-size="14" fill="#777777">leads captured, score distribution, top prospects</text>
  <text x="400" y="286" font-size="14" fill="#777777">no individual feedback, ever</text>
</svg>
